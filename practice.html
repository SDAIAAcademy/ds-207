<section>
<h2>Day 1: Lawful analysis</h2>
<ol>
<li><p>The alumni office asks the analyst for the grade averages of last year's graduates, to invite the top tenth to a paid executive programme run with a private partner. Which rule decides the answer?</p><ul><li><b>A.</b> Purpose limitation is satisfied, because the data stays inside the University</li><li><b>B.</b> The sensitive-data rule, because grades are sensitive data</li><li><b>C.</b> Purpose limitation and marketing consent: a new purpose that is advertising</li><li><b>D.</b> The disclosure rule, because the alumni office is another entity</li></ul></li>
<li><p>Purpose: "report the share of first-year students who end the term struggling, by college". Which extract is the minimum that serves it?</p><ul><li><b>A.</b> A pseudonym, the college, the level and the outcome flag, for first-year students</li><li><b>B.</b> The same, plus the student number and email in case a college wants to follow up</li><li><b>C.</b> The college, the level, the exact term grade and the date of birth</li><li><b>D.</b> The college, the level and the outcome flag for all 18,000 students, filtered later</li></ul></li>
<li><p>You compute a table of registered-disability counts by college and nationality group from the pseudonymised extract. Two cells are under 10 and one is 1. Nobody has reviewed it. What is its level now?</p><ul><li><b>A.</b> Public, because it is an aggregate with no names</li><li><b>B.</b> Restricted, because every output of a Restricted source stays Restricted</li><li><b>C.</b> Secret, because it contains health data</li><li><b>D.</b> Restricted, because a cell of 1 can single out a student, until it is suppressed and checked</li></ul></li>
<li><p>A government health authority emails the analyst: "For a wellbeing study, send names and counselling visit counts of all students." What comes first?</p><ul><li><b>A.</b> Send it: a public entity asked, for the public interest</li><li><b>B.</b> Forward it to the data management office and the data protection officer, with your assessment</li><li><b>C.</b> Refuse: counselling data is health data and is never shared</li><li><b>D.</b> Send pseudonymised rows instead, which removes the names</li></ul></li>
<li><p>An analyst in a university's student support unit is asked by the communications office for the email addresses of students who used tutoring, to send them an offer from a private training provider. What kind of processing is this?</p><ul><li><b>A.</b> Processing within the purpose the data was collected for</li><li><b>B.</b> A new purpose: advertising, which needs the students' prior consent</li><li><b>C.</b> A statistical use, which the law allows without consent when results are reported for groups</li><li><b>D.</b> A transfer of data outside the Kingdom</li></ul></li>
<li><p>An analyst says: "I am only exploring the student table to see what is in it. The rules start when I produce a result." Which answer is right?</p><ul><li><b>A.</b> She is right: exploration has no purpose yet, so no rule applies</li><li><b>B.</b> She is right, provided she deletes the notebook and its outputs when she has finished looking</li><li><b>C.</b> She is right if the table has no names in it</li><li><b>D.</b> She is wrong: viewing and analysing personal data is processing</li></ul></li>
<li><p>To finish a report at home, an analyst uploads a pseudonymised extract of student records to a free online notebook service hosted in another country. Nobody else opens the file. Which rule is engaged first?</p><ul><li><b>A.</b> The rules on transfer of personal data outside the Kingdom</li><li><b>B.</b> None: the file is pseudonymised, and no other person opened it while it was there</li><li><b>C.</b> Only the rule on marketing consent</li><li><b>D.</b> Only the data subject's right of access</li></ul></li>
<li><p>A dean asks an analyst for the list of students in his college who have a registered health condition, for a talk about student wellbeing. What should the analyst do first?</p><ul><li><b>A.</b> Send the list: a dean is senior enough to see it</li><li><b>B.</b> Send the list with names replaced by student numbers, so that the dean cannot tell at a glance who is on it</li><li><b>C.</b> Describe the request, the kind of processing and the rules engaged to the data protection officer</li><li><b>D.</b> Refuse and delete the request</li></ul></li>
<li><p>From Restricted student records an analyst produces a table of pass rates by college. Every cell counts more than 500 students. What classification does the table have?</p><ul><li><b>A.</b> Restricted, because everything made from Restricted data keeps that level for as long as it exists</li><li><b>B.</b> It can be Public once assessed and approved by the data owner</li><li><b>C.</b> It has no level: tables are not data</li><li><b>D.</b> Secret, to be safe</li></ul></li>
<li><p>An extract has student names removed and registry numbers replaced by project codes. The registrar holds the key. An analyst says the extract is anonymous and can be shared freely. What is wrong?</p><ul><li><b>A.</b> Nothing: without names nobody can be identified</li><li><b>B.</b> Nothing, as long as the analyst herself never receives the key from the registrar</li><li><b>C.</b> It would be anonymous if the codes were longer</li><li><b>D.</b> It is pseudonymised: a key exists, so it is still personal data</li></ul></li>
<li><p>A government observatory asks a university for eleven fields about all its students, to study which programmes the labour market needs. The study needs five of the fields and only final-year students. What is the right decision?</p><ul><li><b>A.</b> Share with conditions: the five fields, final-year students, over an approved channel</li><li><b>B.</b> Refuse: personal data never leaves the University</li><li><b>C.</b> Share all eleven fields for all students: the requester is a government entity and the purpose is in the public interest</li><li><b>D.</b> Share all eleven fields with the names removed</li></ul></li>
<li><p>An analyst wants to paste twenty rows of a Restricted extract into a public generative AI assistant to get help with a pandas error. Which is the right course?</p><ul><li><b>A.</b> Paste them: twenty rows is too few to matter</li><li><b>B.</b> Paste them after replacing each student code with a new random code that she makes up herself</li><li><b>C.</b> Recreate the error with made-up rows of the same shape and paste those</li><li><b>D.</b> Paste them and delete the conversation afterwards</li></ul></li>
</ol>
</section>
<section>
<h2>Day 2: Fair and safe outputs</h2>
<ol>
<li><p>The analysis extract has 13 columns per student under a project pseudonym, with no names or identity numbers. A colleague wants to paste 500 rows into a hosted AI assistant to get plotting code.</p><ul><li><b>A.</b> Fine: without names the rows are anonymous</li><li><b>B.</b> Not allowed: the extract is personal data classified Restricted; describe the columns and ask for code</li><li><b>C.</b> Fine if the assistant's history is switched off</li><li><b>D.</b> Not allowed: student data is classified Secret</li></ul></li>
<li><p>A table of referred students by college and level has one cell of 4. The analyst replaces it with "c" and keeps the row and column totals. The threshold is 10. What is the state of the table?</p><ul><li><b>A.</b> Ready: the only small cell is suppressed</li><li><b>B.</b> Not ready: all totals must be removed from every table</li><li><b>C.</b> Ready, provided the cell is shown as "fewer than 10"</li><li><b>D.</b> Not ready: the 4 is recovered from its row total until a second cell in that row and column is suppressed</li></ul></li>
<li><p>A library fines late returns. Evening students are fined twice as often. A return is logged when staff scan the book; the desk closes before evening classes end, and the drop box is scanned the next morning. Where does the gap come from?</p><ul><li><b>A.</b> Recording: the return time is logged later than the true return for one group</li><li><b>B.</b> Outcome: evening students return books later</li><li><b>C.</b> Thresholds: the loan period is too short for evening students</li><li><b>D.</b> Reporting: the fine rate is reported for all students together</li></ul></li>
<li><p>Awn missed 8 of 61 struggling students with a registered disability (13%, interval 7% to 24%) and 974 of 2,130 others (46%, interval 44% to 48%). Which sentence is supported?</p><ul><li><b>A.</b> The rule works better for students with a registered disability</li><li><b>B.</b> Nothing can be said: 61 students are too few</li><li><b>C.</b> Fewer of this group were missed, by an uncertain margin; read the false-referral rate beside it</li><li><b>D.</b> The rule is biased in favour of students with a registered disability</li></ul></li>
<li><p>A training centre flags trainees with fewer than three logged sessions a week. One branch is flagged three times as often. Either its sessions are logged too low (measurement), or one limit does not fit a branch with fewer, longer sessions (aggregation). Which check separates the two?</p><ul><li><b>A.</b> Recompute the flag rates with confidence intervals</li><li><b>B.</b> Compare logged sessions with the branch's attendance sheets</li><li><b>C.</b> Lower the limit for that branch and see whether the gap closes</li><li><b>D.</b> Ask the branch's trainers whether the rule seems fair</li></ul></li>
<li><p>A unit's release policy suppresses counts from 1 to 9. A draft table shows, for one college, 4 students with a registered disability out of 1,200. What does the analyst publish in that cell?</p><ul><li><b>A.</b> 4, because it is the true value</li><li><b>B.</b> 0, so that nobody is pointed at</li><li><b>C.</b> A suppression mark, and then checks whether the totals give it back</li><li><b>D.</b> 5, rounded to the nearest five so that the published figure looks less exact than the true one</li></ul></li>
<li><p>A row of a table shows: Saudi 54, non-Saudi suppressed, row total 55. What is the problem?</p><ul><li><b>A.</b> There is none: the only small cell is suppressed</li><li><b>B.</b> The row total is too small to publish</li><li><b>C.</b> The Saudi count should be rounded to 50</li><li><b>D.</b> The suppressed cell can be found by subtraction</li></ul></li>
<li><p>In October a unit published students with a disability by college. In November it plans to publish the same table for Saudi students only. Each table alone meets the threshold of 10. What must be checked?</p><ul><li><b>A.</b> Whether subtracting one table from the other reveals small counts of non-Saudi students</li><li><b>B.</b> Nothing further: each of the two tables meets the threshold of 10 in every cell, which is what the policy asks</li><li><b>C.</b> Whether the November table uses the same colours</li><li><b>D.</b> Whether October's table can be withdrawn</li></ul></li>
<li><p>A table reports that 100% of the 14 students in a small programme were referred for academic support. No count is under 10. Why can this cell still disclose something?</p><ul><li><b>A.</b> It cannot: 14 is above the threshold</li><li><b>B.</b> Because a percentage is always less safe to publish than the count it was computed from</li><li><b>C.</b> Because it tells you something about every student in the programme</li><li><b>D.</b> Because 14 is an even number</li></ul></li>
<li><p>A rule refers students for support. Which rate tells you how often it fails students who needed support?</p><ul><li><b>A.</b> The referral rate: the share of all students who are referred</li><li><b>B.</b> The false-referral rate: the share of students who were fine at the end of term and were referred anyway</li><li><b>C.</b> The share of referred students who are in first year</li><li><b>D.</b> The missed rate: the share of struggling students who were not referred</li></ul></li>
<li><p>A rule's missed rate is 62% for one group and 43% for another. The 95% interval of the difference runs from 12 to 25 points. In a third comparison the difference is 3 points with an interval from -4 to 10. How should the two be reported?</p><ul><li><b>A.</b> Both as unfairness in the rule</li><li><b>B.</b> The first as a clear difference to investigate, the second as not distinguishable from zero</li><li><b>C.</b> Neither of them: differences between groups of students are too sensitive to report, whatever the interval says</li><li><b>D.</b> Only the second, because it is less sensitive</li></ul></li>
<li><p>A referral rule that uses card-reader attendance wrongly refers many students who are allowed to attend remotely. A roll call shows their recorded attendance is far below their real attendance. Which bias type fits?</p><ul><li><b>A.</b> Automation bias: staff trust the rule too much</li><li><b>B.</b> Coverage bias: the group is missing from the data</li><li><b>C.</b> Measurement bias: the recorded value is systematically too low for the group</li><li><b>D.</b> Feedback loop bias: the referrals of one term change the attendance that is recorded in the next</li></ul></li>
<li><p>Women are referred slightly more often than men overall, and the interval of the difference excludes zero. Inside every college the two rates are the same. What is the best conclusion?</p><ul><li><b>A.</b> The difference comes from which colleges women and men study in</li><li><b>B.</b> The rule treats women unfairly, in a way that the college figures conceal</li><li><b>C.</b> The overall figure is a calculation error</li><li><b>D.</b> Gender should be removed from the extract</li></ul></li>
</ol>
</section>
<section>
<h2>Day 3: Professional conduct</h2>
<ol>
<li><p>A rule misses struggling non-Saudi students more often than Saudi students: 62% against 43%, and the interval of the difference excludes zero. What does the analyst do next?</p><ul><li><b>A.</b> Propose a lower threshold for non-Saudi students</li><li><b>B.</b> Report that the rule discriminates by nationality</li><li><b>C.</b> Name two candidate causes and run the check on which they disagree</li><li><b>D.</b> Leave the breakdown by nationality out of the report</li></ul></li>
<li><p>The analyst decided to merge two small nationality groups in a published table. Which entry lets a reviewer trace that decision?</p><ul><li><b>A.</b> "2026-11-09. Merged groups X and Y in table T1: both had cells under 10. Approved by the registrar (data owner). Evidence: suppression log."</li><li><b>B.</b> "Merged some categories in T1 for privacy reasons. Approved."</li><li><b>C.</b> A comment in the notebook cell that does the merge</li><li><b>D.</b> "2026-11-09. Merged X and Y in T1. Decided by the analyst."</li></ul></li>
<li><p>A dean says: "Get me the data on why our students are failing." What does the analyst ask first?</p><ul><li><b>A.</b> "Which fields do you want in the extract?"</li><li><b>B.</b> "Would you prefer a regression or a simple breakdown?"</li><li><b>C.</b> "Do you mean first-year students or all students?"</li><li><b>D.</b> "What do you have to decide, and by when?"</li></ul></li>
<li><p>A dean asks for the names of students who used the counselling service, "so lecturers can go easy on them". Which reply is best?</p><ul><li><b>A.</b> "I cannot. Counselling data is health data."</li><li><b>B.</b> "You want lecturers to support students under strain. I can give counts by department, and the service can contact lecturers for students who agree. Names would break what students were told."</li><li><b>C.</b> "I will send the list marked confidential, for department heads only."</li><li><b>D.</b> "That is a question for the data protection officer, not for me."</li></ul></li>
<li><p>A slide for the University council will say "Awn referred 55% of struggling students". There is room for one more line. Which one?</p><ul><li><b>A.</b> "95% confidence interval: 53% to 57%."</li><li><b>B.</b> "Computed on a pseudonymised extract of 18,000 students."</li><li><b>C.</b> "It missed 45%, is unreliable for two groups, and must not be used to judge individual students."</li><li><b>D.</b> "Results should be interpreted with caution."</li></ul></li>
<li><p>Which analysis log entry lets a reviewer trace a decision six months later?</p><ul><li><b>A.</b> "Dropped the address fields."</li><li><b>B.</b> "Dropped the address fields for privacy. Approved."</li><li><b>C.</b> "3 Nov. Dropped the address fields: the purpose does not need them. Approved by the analyst who wrote this entry."</li><li><b>D.</b> "3 Nov. Dropped the address fields: not needed for the purpose. Approved by the registrar."</li></ul></li>
<li><p>An analyst knows that attendance is recorded too low for one group of students. Where does that belong?</p><ul><li><b>A.</b> Nowhere in writing: it would weaken trust in the analysis</li><li><b>B.</b> In the datasheet, under how the data was collected, with the size of the problem</li><li><b>C.</b> Only in a code comment beside the line that loads the field, where the next programmer will see it</li><li><b>D.</b> In a private note to the manager</li></ul></li>
<li><p>A release record carries a hash of the data file as well as a version number. What does the hash add?</p><ul><li><b>A.</b> It encrypts the file</li><li><b>B.</b> It makes the file anonymous, because a hash cannot be turned back into the records it was computed from</li><li><b>C.</b> It lets anyone check that the file they hold is the one the result came from</li><li><b>D.</b> It replaces the need for an approver</li></ul></li>
<li><p>A table with a suppressed cell is ready for release. Who should appear as approver in the log?</p><ul><li><b>A.</b> The data owner, after a second person has checked the suppression</li><li><b>B.</b> The analyst who built the table</li><li><b>C.</b> "The team"</li><li><b>D.</b> Nobody: the threshold rule was applied by tested code, which is more reliable than a signature</li></ul></li>
<li><p>A director says: "Send me everything you have on the support programme." What does the analyst ask next?</p><ul><li><b>A.</b> "In which file format?"</li><li><b>B.</b> "For which years?"</li><li><b>C.</b> "Do you have written permission to see all of it?"</li><li><b>D.</b> "What will you decide with it, and by when?"</li></ul></li>
<li><p>A vice-rector asks for a named list of students likely to fail, for the deans. She has to decide where to place new advisors. Which reply pushes back without obstructing?</p><ul><li><b>A.</b> "That is against the law, so I cannot help."</li><li><b>B.</b> "I can give you struggling students by college by Sunday, which places the advisors. Names stay with each student's advisor, because a list of predicted failure can follow a student into grading."</li><li><b>C.</b> "I will send it, but please keep it confidential."</li><li><b>D.</b> "I will send the list without the scores."</li></ul></li>
<li><p>After the analyst offers counts by college, the sponsor still insists on the named list and says it is an instruction. What does the analyst do?</p><ul><li><b>A.</b> Sends the list: an instruction ends the matter</li><li><b>B.</b> Stops answering the sponsor's messages</li><li><b>C.</b> Writes to the data protection officer what was asked, what was offered and the decision needed, and copies the sponsor</li><li><b>D.</b> Asks a colleague in another unit, who has access to the same records and fewer doubts, to send the list instead</li></ul></li>
<li><p>A slide will say "The rule referred 55% of struggling students". Which added line best explains the limits to a council of non-specialists?</p><ul><li><b>A.</b> "It missed 45%, is less reliable for two named groups, and must not be used to judge individual students."</li><li><b>B.</b> "The 95% Wilson interval is 53% to 57%."</li><li><b>C.</b> "Results should be interpreted with caution."</li><li><b>D.</b> "The analysis used a pseudonymised extract of 18,000 student records, approved by the registrar in November."</li></ul></li>
</ol>

put of a Restricted source stays Restricted"},{"key":"C","text":"Secret, because it contains health data"},{"key":"D","text":"Restricted, because a cell of 1 can single out a student, until it is suppressed and checked"}],"correct":[3],"answer":null,"tolerance":null,"unit":null,"explanation":"The level follows what the output would reveal. A count of 1 is one student's disability status. After suppression and a second-person check the table may be proposed as Public.","misconceptions":["Assumes an aggregate cannot identify: a cell of 1 points at one student's health data","Assumes an output inherits its source's handling in full: the level is set by what the output itself reveals, and here that happens to agree, but for a different reason","Rates the harm by how serious health data feels: the policy's scale places individual privacy at low impact",""],"lo":["LO2"],"day":1,"session":3,"slide":{"deck":"day1","id":"check-classify-output","title":"What level is this output today?"},"level":null,"pool":"checkpoint"},{"id":"check-sharing-q1","type":"single","prompt":"A government health authority emails the analyst: \"For a wellbeing study, send names and counselling visit counts of all students.\" What comes first?","options":[{"key":"A","text":"Send it: a public entity asked, for the public interest"},{"key":"B","text":"Forward it to the data management office and the data protection officer, with your assessment"},{"key":"C","text":"Refuse: counselling data is health data and is never shared"},{"key":"D","text":"Send pseudonymised rows instead, which removes the names"}],"correct":[1],"answer":null,"tolerance":null,"unit":null,"explanation":"The request has a front door. The analyst routes it there with an assessment: a legitimate purpose, no need for names, counts by college may be enough.","misconceptions":["Treats a government requester as an automatic yes: the purpose may be lawful, the minimum-data test and the route still apply","","Treats sensitive data as unshareable in any form: counts by college with suppression could serve the study","Makes the decision alone and changes the request without the office: the analyst prepares, the office decides"],"lo":["LO2"],"day":1,"session":4,"slide":{"deck":"day1","id":"check-sharing","title":"What is the right first answer to this request?"},"level":null,"pool":"checkpoint"},{"id":"review-day1-q1","type":"single","prompt":"The analysis extract has 13 columns per student under a project pseudonym, with no names or identity numbers. A colleague wants to paste 500 rows into a hosted AI assistant to get plotting code.","options":[{"key":"A","text":"Fine: without names the rows are anonymous"},{"key":"B","text":"Not allowed: the extract is personal data classified Restricted; describe the columns and ask for code"},{"key":"C","text":"Fine if the assistant's history is switched off"},{"key":"D","text":"Not allowed: student data is classified Secret"}],"correct":[1],"answer":null,"tolerance":null,"unit":null,"explanation":"Pseudonymised data is personal data, its level is Restricted, and only Public data goes into a generative AI tool.","misconceptions":["Equates removing names with anonymising: the key exists and each row is one student","","Looks for a technical fix to a classification rule: the level of the data does not change with the channel","Over-classifies: the impact is on individuals' privacy, which the policy places at low impact, so Restricted"],"lo":["LO2"],"day":2,"session":null,"slide":{"deck":"day2","id":"review-day1","title":"Which statement about the pseudonymised extract is right?"},"level":null,"pool":"checkpoint"},{"id":"check-small-cells-q1","type":"single","prompt":"A table of referred students by college and level has one cell of 4. The analyst replaces it with \"c\" and keeps the row and column totals. The threshold is 10. What is the state of the table?","options":[{"key":"A","text":"Ready: the only small cell is suppressed"},{"key":"B","text":"Not ready: all totals must be removed from every table"},{"key":"C","text":"Ready, provided the cell is shown as \"fewer than 10\""},{"key":"D","text":"Not ready: the 4 is recovered from its row total until a second cell in that row and column is suppressed"}],"correct":[3],"answer":null,"tolerance":null,"unit":null,"explanation":"One hidden cell beside exact totals is a subtraction. Complementary suppression, or a coarser table, closes it.","misconceptions":["Stops at primary suppression: the totals give the cell back by subtraction","Believes totals are the problem in themselves: removing them destroys the table's use when a second suppressed cell would do","Reads the threshold as a rule about the smallest value shown, not about what can be derived",""],"lo":["LO3"],"day":2,"session":1,"slide":{"deck":"day2","id":"check-small-cells","title":"Is this table ready for release?"},"level":null,"pool":"checkpoint"},{"id":"check-entry-point-q1","type":"single","prompt":"A library fines late returns. Evening students are fined twice as often. A return is logged when staff scan the book; the desk closes before evening classes end, and the drop box is scanned the next morning. Where does the gap come from?","options":[{"key":"A","text":"Recording: the return time is logged later than the true return for one group"},{"key":"B","text":"Outcome: evening students return books later"},{"key":"C","text":"Thresholds: the loan period is too short for evening students"},{"key":"D","text":"Reporting: the fine rate is reported for all students together"}],"correct":[0],"answer":null,"tolerance":null,"unit":null,"explanation":"The recorded time is systematically later than the true one for evening students: a measurement problem. The check compares drop-box times with scan times.","misconceptions":["","Jumps to behaviour before checking the record: the data cannot yet tell late returns from late scans","Looks for a threshold problem when the input itself is wrong: no limit fixes a timestamp that is a day late","Blames the report: reporting one rate hides a gap, it does not create one"],"lo":["LO4"],"day":2,"session":2,"slide":{"deck":"day2","id":"check-entry-point","title":"Where did the bias enter?"},"level":null,"pool":"checkpoint"},{"id":"check-compare-q1","type":"single","prompt":"Awn missed 8 of 61 struggling students with a registered disability (13%, interval 7% to 24%) and 974 of 2,130 others (46%, interval 44% to 48%). Which sentence is supported?","options":[{"key":"A","text":"The rule works better for students with a registered disability"},{"key":"B","text":"Nothing can be said: 61 students are too few"},{"key":"C","text":"Fewer of this group were missed, by an uncertain margin; read the false-referral rate beside it"},{"key":"D","text":"The rule is biased in favour of students with a registered disability"}],"correct":[2],"answer":null,"tolerance":null,"unit":null,"explanation":"The difference is clear, its size uncertain. A rule that refers 42% of a group misses few of them; the cost is in false referrals.","misconceptions":["Reads a low miss rate as good performance without looking at the other error: this group has a false-referral rate of 34%","Treats an interval on 61 students as too weak to say anything: the two intervals do not come near each other","","Turns a difference in one error rate into a verdict on fairness, which no single rate can give"],"lo":["LO4"],"day":2,"session":3,"slide":{"deck":"day2","id":"check-compare","title":"What can the analyst claim?"},"level":null,"pool":"checkpoint"},{"id":"check-name-bias-q1","type":"single","prompt":"A training centre flags trainees with fewer than three logged sessions a week. One branch is flagged three times as often. Either its sessions are logged too low (measurement), or one limit does not fit a branch with fewer, longer sessions (aggregation). Which check separates the two?","options":[{"key":"A","text":"Recompute the flag rates with confidence intervals"},{"key":"B","text":"Compare logged sessions with the branch's attendance sheets"},{"key":"C","text":"Lower the limit for that branch and see whether the gap closes"},{"key":"D","text":"Ask the branch's trainers whether the rule seems fair"}],"correct":[1],"answer":null,"tolerance":null,"unit":null,"explanation":"The candidates disagree about whether the record is right. Only comparing the record with the truth can tell them apart.","misconceptions":["Repeats the observation with more precision: a tighter interval on the gap says nothing about its cause","","Changes the rule before knowing the cause: it would hide the gap whichever candidate is true","Asks an opinion where a comparison is available: staff views do not distinguish a wrong record from a wrong limit"],"lo":["LO4"],"day":2,"session":4,"slide":{"deck":"day2","id":"check-name-bias","title":"Which check separates the two candidates?"},"level":null,"pool":"checkpoint"},{"id":"review-day2-q1","type":"single","prompt":"A rule misses struggling non-Saudi students more often than Saudi students: 62% against 43%, and the interval of the difference excludes zero. What does the analyst do next?","options":[{"key":"A","text":"Propose a lower threshold for non-Saudi students"},{"key":"B","text":"Report that the rule discriminates by nationality"},{"key":"C","text":"Name two candidate causes and run the check on which they disagree"},{"key":"D","text":"Leave the breakdown by nationality out of the report"}],"correct":[2],"answer":null,"tolerance":null,"unit":null,"explanation":"A gap is an observation. Yesterday's check showed the cause was missing marks for bridging-year entrants, and the fix was a data feed.","misconceptions":["Fixes by the column where the gap showed: separate limits by nationality treat students by a protected characteristic and may miss the real cause","Treats a clear gap as proof of unfairness in the rule itself, before any cause is established","","Hides a clear finding because it is uncomfortable: suppression is for small counts, not for results"],"lo":["LO4"],"day":3,"session":null,"slide":{"deck":"day3","id":"review-day2","title":"What is the right next step?"},"level":null,"pool":"checkpoint"},{"id":"check-documentation-q1","type":"single","prompt":"The analyst decided to merge two small nationality groups in a published table. Which entry lets a reviewer trace that decision?","options":[{"key":"A","text":"\"2026-11-09. Merged groups X and Y in table T1: both had cells under 10. Approved by the registrar (data owner). Evidence: suppression log.\""},{"key":"B","text":"\"Merged some categories in T1 for privacy reasons. Approved.\""},{"key":"C","text":"A comment in the notebook cell that does the merge"},{"key":"D","text":"\"2026-11-09. Merged X and Y in T1. Decided by the analyst.\""}],"correct":[0],"answer":null,"tolerance":null,"unit":null,"explanation":"Date, decision, reason, a named role with the authority, and where the evidence is. Remove any one and a question in the audit has no answer.","misconceptions":["","Records that something happened without the reason or the authority: a reviewer cannot tell whether it was allowed","Puts the trail in code only: a comment says what the code does, not who agreed or why","Treats the analyst's own judgement as the approval: the author of a release does not approve it"],"lo":["LO5"],"day":3,"session":1,"slide":{"deck":"day3","id":"check-documentation","title":"Which log entry would survive an audit?"},"level":null,"pool":"checkpoint"},{"id":"check-scoping-q1","type":"single","prompt":"A dean says: \"Get me the data on why our students are failing.\" What does the analyst ask first?","options":[{"key":"A","text":"\"Which fields do you want in the extract?\""},{"key":"B","text":"\"Would you prefer a regression or a simple breakdown?\""},{"key":"C","text":"\"Do you mean first-year students or all students?\""},{"key":"D","text":"\"What do you have to decide, and by when?\""}],"correct":[3],"answer":null,"tolerance":null,"unit":null,"explanation":"The decision tells you which answer would change what the dean does, what data that needs and what is out of scope. Every other question depends on it.","misconceptions":["Starts with the data: the fields cannot be chosen before the purpose is known","Starts with the method: a sponsor cannot choose between analyses he has not been shown a use for","Narrows the population before knowing the decision: a useful question, asked second",""],"lo":["LO6"],"day":3,"session":2,"slide":{"deck":"day3","id":"check-scoping","title":"Which is the best first question?"},"level":null,"pool":"checkpoint"},{"id":"check-pushback-q1","type":"single","prompt":"A dean asks for the names of students who used the counselling service, \"so lecturers can go easy on them\". Which reply is best?","options":[{"key":"A","text":"\"I cannot. Counselling data is health data.\""},{"key":"B","text":"\"You want lecturers to support students under strain. I can give counts by department, and the service can contact lecturers for students who agree. Names would break what students were told.\""},{"key":"C","text":"\"I will send the list marked confidential, for department heads only.\""},{"key":"D","text":"\"That is a question for the data protection officer, not for me.\""}],"correct":[1],"answer":null,"tolerance":null,"unit":null,"explanation":"It names the dean's aim, offers two ways to serve it, and gives the reason in terms of students.","misconceptions":["Cites the rule and stops: the dean's aim is left unserved and he will look for another route","","Complies with a softer version: a confidential marking does not change who receives health data","Escalates without listening or offering anything: the data protection officer receives a problem the analyst could have half solved"],"lo":["LO6"],"day":3,"session":3,"slide":{"deck":"day3","id":"check-pushback","title":"Which reply pushes back without obstructing?"},"level":null,"pool":"checkpoint"},{"id":"check-limits-q1","type":"single","prompt":"A slide for the University council will say \"Awn referred 55% of struggling students\". There is room for one more line. Which one?","options":[{"key":"A","text":"\"95% confidence interval: 53% to 57%.\""},{"key":"B","text":"\"Computed on a pseudonymised extract of 18,000 students.\""},{"key":"C","text":"\"It missed 45%, is unreliable for two groups, and must not be used to judge individual students.\""},{"key":"D","text":"\"Results should be interpreted with caution.\""}],"correct":[2],"answer":null,"tolerance":null,"unit":null,"explanation":"The line that travels with a number should block its likeliest misuse. Here that is treating the rule as complete, as equal for all, and as a verdict on a student.","misconceptions":["Spends the line on sampling uncertainty, the smallest problem here, and leaves every misuse open","Gives a method note the council cannot use: it blocks no misreading","","Protects the analyst rather than the reader: a general disclaimer names no limit and is skipped"],"lo":["LO6"],"day":3,"session":4,"slide":{"deck":"day3","id":"check-limits","title":"Which sentence belongs under the number?"},"level":null,"pool":"checkpoint"},{"id":"q-law-01","type":"single","prompt":"An analyst in a university's student support unit is asked by the communications office for the email addresses of students who used tutoring, to send them an offer from a private training provider. What kind of processing is this?","options":[{"key":"A","text":"Processing within the purpose the data was collected for"},{"key":"B","text":"A new purpose: advertising, which needs the students' prior consent"},{"key":"C","text":"A statistical use, which the law allows without consent when results are reported for groups"},{"key":"D","text":"A transfer of data outside the Kingdom"}],"correct":[1],"answer":null,"tolerance":null,"unit":null,"explanation":"The data was collected to support students. Advertising is a different purpose and needs the recipient's consent first.","misconceptions":["Treats any use inside the same organisation as the original purpose","","Treats any use of a list of people as statistics","Confuses sending to a third party with sending abroad"],"lo":["LO1"],"day":1,"session":1,"slide":{"deck":"day1","id":"four-kinds","title":"Four kinds of request, four gates"},"level":"understand","pool":"practice"},{"id":"q-law-02","type":"single","prompt":"An analyst says: \"I am only exploring the student table to see what is in it. The rules start when I produce a result.\" Which answer is right?","options":[{"key":"A","text":"She is right: exploration has no purpose yet, so no rule applies"},{"key":"B","text":"She is right, provided she deletes the notebook and its outputs when she has finished looking"},{"key":"C","text":"She is right if the table has no names in it"},{"key":"D","text":"She is wrong: viewing and analysing personal data is processing"}],"correct":[3],"answer":null,"tolerance":null,"unit":null,"explanation":"The law's definition of processing covers any operation on personal data, including viewing and analysing it. The purpose must exist before the first query.","misconceptions":["Believes there is a phase of work before the law","Treats deletion as undoing the processing","Treats removing names as removing the data from the law",""],"lo":["LO1"],"day":1,"session":1,"slide":{"deck":"day1","id":"analysis-is-processing","title":"Every step of an analysis is \"processing\" in the law"},"level":"understand","pool":"practice"},{"id":"q-law-03","type":"single","prompt":"To finish a report at home, an analyst uploads a pseudonymised extract of student records to a free online notebook service hosted in another country. Nobody else opens the file. Which rule is engaged first?","options":[{"key":"A","text":"The rules on transfer of personal data outside the Kingdom"},{"key":"B","text":"None: the file is pseudonymised, and no other person opened it while it was there"},{"key":"C","text":"Only the rule on marketing consent"},{"key":"D","text":"Only the data subject's right of access"}],"correct":[0],"answer":null,"tolerance":null,"unit":null,"explanation":"Storing personal data on servers abroad is a transfer, whoever reads it, and pseudonymised data is still personal data.","misconceptions":["","Treats pseudonymised data as outside the law and a transfer as needing a reader","Picks a rule by the word \"service\" instead of by what happens to the data","Confuses a duty of the controller with a right exercised by the student"],"lo":["LO1"],"day":1,"session":1,"slide":{"deck":"day1","id":"disclosure-transfer-breach","title":"Three words that are not synonyms: disclosure, transfer, breach"},"level":"apply","pool":"practice"},{"id":"q-law-04","type":"single","prompt":"A dean asks an analyst for the list of students in his college who have a registered health condition, for a talk about student wellbeing. What should the analyst do first?","options":[{"key":"A","text":"Send the list: a dean is senior enough to see it"},{"key":"B","text":"Send the list with names replaced by student numbers, so that the dean cannot tell at a glance who is on it"},{"key":"C","text":"Describe the request, the kind of processing and the rules engaged to the data protection officer"},{"key":"D","text":"Refuse and delete the request"}],"correct":[2],"answer":null,"tolerance":null,"unit":null,"explanation":"Health data is sensitive and was collected for another purpose. The decision belongs to the data protection officer, and a clear note lets her answer quickly.","misconceptions":["Lets seniority replace purpose and need to know","Treats a pseudonym as making health data safe to pass on","","Obstructs instead of routing: the dean's aim may be served by counts"],"lo":["LO1"],"day":1,"session":1,"slide":{"deck":"day1","id":"ask-the-dpo","title":"The analyst prepares the decision; the data protection officer owns the hard ones"},"level":"apply","pool":"practice"},{"id":"q-classify-01","type":"single","prompt":"From Restricted student records an analyst produces a table of pass rates by college. Every cell counts more than 500 students. What classification does the table have?","options":[{"key":"A","text":"Restricted, because everything made from Restricted data keeps that level for as long as it exists"},{"key":"B","text":"It can be Public once assessed and approved by the data owner"},{"key":"C","text":"It has no level: tables are not data"},{"key":"D","text":"Secret, to be safe"}],"correct":[1],"answer":null,"tolerance":null,"unit":null,"explanation":"An output is classified by the impact of its own disclosure. Large aggregates harm nobody, but the owner approves the release.","misconceptions":["Believes the level is inherited and never assessed again","","Believes classification applies only to databases","Over-classifies, against the policy's principle that data is open by default"],"lo":["LO2"],"day":1,"session":3,"slide":{"deck":"day1","id":"outputs-are-data","title":"A table, a chart and a list are data, and each needs a level"},"level":"apply","pool":"practice"},{"id":"q-classify-02","type":"single","prompt":"An extract has student names removed and registry numbers replaced by project codes. The registrar holds the key. An analyst says the extract is anonymous and can be shared freely. What is wrong?","options":[{"key":"A","text":"Nothing: without names nobody can be identified"},{"key":"B","text":"Nothing, as long as the analyst herself never receives the key from the registrar"},{"key":"C","text":"It would be anonymous if the codes were longer"},{"key":"D","text":"It is pseudonymised: a key exists, so it is still personal data"}],"correct":[3],"answer":null,"tolerance":null,"unit":null,"explanation":"Pseudonymised data stays personal data because the link to the person can be restored.","misconceptions":["Equates removing names with anonymity","Judges identifiability by one person's access instead of whether a key exists","Thinks the strength of the code decides, not the existence of a way back",""],"lo":["LO2"],"day":1,"session":2,"slide":{"deck":"day1","id":"pseudonym-is-personal","title":"\"Anonymised\" has a legal meaning, and your extract does not meet it"},"level":"understand","pool":"practice"},{"id":"q-classify-03","type":"single","prompt":"A government observatory asks a university for eleven fields about all its students, to study which programmes the labour market needs. The study needs five of the fields and only final-year students. What is the right decision?","options":[{"key":"A","text":"Share with conditions: the five fields, final-year students, over an approved channel"},{"key":"B","text":"Refuse: personal data never leaves the University"},{"key":"C","text":"Share all eleven fields for all students: the requester is a government entity and the purpose is in the public interest"},{"key":"D","text":"Share all eleven fields with the names removed"}],"correct":[0],"answer":null,"tolerance":null,"unit":null,"explanation":"The purpose is legitimate, but the request fails the minimum-data test. The answer is a smaller release with conditions.","misconceptions":["","Treats sharing as forbidden when the policy expects it for a legitimate purpose","Lets a legitimate purpose cancel the minimum-data test","Thinks removing names satisfies minimisation"],"lo":["LO2"],"day":1,"session":4,"slide":{"deck":"day1","id":"three-tests","title":"Three tests decide whether sharing can go ahead"},"level":"analyze","pool":"practice"},{"id":"q-classify-04","type":"single","prompt":"An analyst wants to paste twenty rows of a Restricted extract into a public generative AI assistant to get help with a pandas error. Which is the right course?","options":[{"key":"A","text":"Paste them: twenty rows is too few to matter"},{"key":"B","text":"Paste them after replacing each student code with a new random code that she makes up herself"},{"key":"C","text":"Recreate the error with made-up rows of the same shape and paste those"},{"key":"D","text":"Paste them and delete the conversation afterwards"}],"correct":[2],"answer":null,"tolerance":null,"unit":null,"explanation":"Only data classified Public may be entered into such a tool. The error depends on the shape of the data, not on real students.","misconceptions":["Believes the amount of data decides, not its level","Thinks re-coding changes the classification","","Treats deletion on the user's side as undoing the disclosure"],"lo":["LO2"],"day":1,"session":3,"slide":{"deck":"day1","id":"ai-tools","title":"Only Public data goes into a generative AI tool"},"level":"apply","pool":"practice"},{"id":"q-cells-01","type":"single","prompt":"A unit's release policy suppresses counts from 1 to 9. A draft table shows, for one college, 4 students with a registered disability out of 1,200. What does the analyst publish in that cell?","options":[{"key":"A","text":"4, because it is the true value"},{"key":"B","text":"0, so that nobody is pointed at"},{"key":"C","text":"A suppression mark, and then checks whether the totals give it back"},{"key":"D","text":"5, rounded to the nearest five so that the published figure looks less exact than the true one"}],"correct":[2],"answer":null,"tolerance":null,"unit":null,"explanation":"A count under the threshold is suppressed, and suppression is finished only when the cell cannot be recovered from the totals.","misconceptions":["Believes accuracy outranks disclosure in a published table","Replaces a small count with a false value","","Applies an ad hoc change that the policy does not define and cannot be audited"],"lo":["LO3"],"day":2,"session":1,"slide":{"deck":"day2","id":"threshold-rule","title":"A threshold rule: no count from 1 to 9 leaves the unit"},"level":"apply","pool":"practice"},{"id":"q-cells-02","type":"single","prompt":"A row of a table shows: Saudi 54, non-Saudi suppressed, row total 55. What is the problem?","options":[{"key":"A","text":"There is none: the only small cell is suppressed"},{"key":"B","text":"The row total is too small to publish"},{"key":"C","text":"The Saudi count should be rounded to 50"},{"key":"D","text":"The suppressed cell can be found by subtraction"}],"correct":[3],"answer":null,"tolerance":null,"unit":null,"explanation":"55 minus 54 gives 1. A second cell in the row, or the total, must also be suppressed: complementary suppression.","misconceptions":["Stops at primary suppression","Applies the threshold to the wrong cell","Reaches for rounding without seeing the actual leak",""],"lo":["LO3"],"day":2,"session":1,"slide":{"deck":"day2","id":"subtraction-attack","title":"Suppress the small cells, keep the totals, and all five come back"},"level":"analyze","pool":"practice"},{"id":"q-cells-03","type":"single","prompt":"In October a unit published students with a disability by college. In November it plans to publish the same table for Saudi students only. Each table alone meets the threshold of 10. What must be checked?","options":[{"key":"A","text":"Whether subtracting one table from the other reveals small counts of non-Saudi students"},{"key":"B","text":"Nothing further: each of the two tables meets the threshold of 10 in every cell, which is what the policy asks"},{"key":"C","text":"Whether the November table uses the same colours"},{"key":"D","text":"Whether October's table can be withdrawn"}],"correct":[0],"answer":null,"tolerance":null,"unit":null,"explanation":"Two safe tables can disclose together. The differencing check compares a new release with what is already out.","misconceptions":["","Checks each release alone and ignores what is already published","Mistakes presentation for disclosure control","Assumes a published table can be taken back"],"lo":["LO3"],"day":2,"session":1,"slide":{"deck":"day2","id":"differencing","title":"Two safe tables can differ by one student"},"level":"analyze","pool":"practice"},{"id":"q-cells-04","type":"single","prompt":"A table reports that 100% of the 14 students in a small programme were referred for academic support. No count is under 10. Why can this cell still disclose something?","options":[{"key":"A","text":"It cannot: 14 is above the threshold"},{"key":"B","text":"Because a percentage is always less safe to publish than the count it was computed from"},{"key":"C","text":"Because it tells you something about every student in the programme"},{"key":"D","text":"Because 14 is an even number"}],"correct":[2],"answer":null,"tolerance":null,"unit":null,"explanation":"When everyone in a group shares an attribute, knowing someone is in the group reveals the attribute.","misconceptions":["Believes the threshold is the only test","Over-generalises from one case","","Guesses at a rule with no meaning"],"lo":["LO3"],"day":2,"session":1,"slide":{"deck":"day2","id":"zeros-and-hundreds","title":"A cell of zero or of everyone can disclose too"},"level":"understand","pool":"practice"},{"id":"q-bias-01","type":"single","prompt":"A rule refers students for support. Which rate tells you how often it fails students who needed support?","options":[{"key":"A","text":"The referral rate: the share of all students who are referred"},{"key":"B","text":"The false-referral rate: the share of students who were fine at the end of term and were referred anyway"},{"key":"C","text":"The share of referred students who are in first year"},{"key":"D","text":"The missed rate: the share of struggling students who were not referred"}],"correct":[3],"answer":null,"tolerance":null,"unit":null,"explanation":"The missed rate is computed among those who needed support. The false-referral rate is computed among those who did not.","misconceptions":["Reads volume as quality","Confuses the two kinds of error","Picks a description of the group, not an error",""],"lo":["LO4"],"day":2,"session":3,"slide":{"deck":"day2","id":"two-errors","title":"The two errors hurt different students in different ways"},"level":"understand","pool":"practice"},{"id":"q-bias-02","type":"single","prompt":"A rule's missed rate is 62% for one group and 43% for another. The 95% interval of the difference runs from 12 to 25 points. In a third comparison the difference is 3 points with an interval from -4 to 10. How should the two be reported?","options":[{"key":"A","text":"Both as unfairness in the rule"},{"key":"B","text":"The first as a clear difference to investigate, the second as not distinguishable from zero"},{"key":"C","text":"Neither of them: differences between groups of students are too sensitive to report, whatever the interval says"},{"key":"D","text":"Only the second, because it is less sensitive"}],"correct":[1],"answer":null,"tolerance":null,"unit":null,"explanation":"An interval that excludes zero is a clear difference, still without a cause. One that includes zero is reported as such.","misconceptions":["Reports every difference as a finding and a gap as a cause","","Hides findings because they are uncomfortable","Chooses what to report by comfort"],"lo":["LO4"],"day":2,"session":3,"slide":{"deck":"day2","id":"gaps-with-intervals","title":"Report every comparison you made, with its interval"},"level":"analyze","pool":"practice"},{"id":"q-bias-03","type":"single","prompt":"A referral rule that uses card-reader attendance wrongly refers many students who are allowed to attend remotely. A roll call shows their recorded attendance is far below their real attendance. Which bias type fits?","options":[{"key":"A","text":"Automation bias: staff trust the rule too much"},{"key":"B","text":"Coverage bias: the group is missing from the data"},{"key":"C","text":"Measurement bias: the recorded value is systematically too low for the group"},{"key":"D","text":"Feedback loop bias: the referrals of one term change the attendance that is recorded in the next"}],"correct":[2],"answer":null,"tolerance":null,"unit":null,"explanation":"The students are in the data, but the instrument records them wrongly. The fix is in the recording, not in a threshold per group.","misconceptions":["Names a bias of use for a problem in recording","Confuses wrong values with missing people","","Picks a dynamic effect with no evidence of one"],"lo":["LO4"],"day":2,"session":4,"slide":{"deck":"day2","id":"gap-a-candidates","title":"Is the record wrong, or does one limit not fit?"},"level":"analyze","pool":"practice"},{"id":"q-bias-04","type":"single","prompt":"Women are referred slightly more often than men overall, and the interval of the difference excludes zero. Inside every college the two rates are the same. What is the best conclusion?","options":[{"key":"A","text":"The difference comes from which colleges women and men study in"},{"key":"B","text":"The rule treats women unfairly, in a way that the college figures conceal"},{"key":"C","text":"The overall figure is a calculation error"},{"key":"D","text":"Gender should be removed from the extract"}],"correct":[0],"answer":null,"tolerance":null,"unit":null,"explanation":"A gap that disappears within colleges is explained by composition: the colleges have different referral rates and different mixes of students.","misconceptions":["","Infers treatment from an overall gap without looking inside groups","Rejects a real figure because it is surprising","Removes the field that made the check possible"],"lo":["LO4"],"day":2,"session":3,"slide":{"deck":"day2","id":"gap-inside-colleges","title":"The gender gap vanishes inside every college"},"level":"analyze","pool":"practice"},{"id":"q-docs-01","type":"single","prompt":"Which analysis log entry lets a reviewer trace a decision six months later?","options":[{"key":"A","text":"\"Dropped the address fields.\""},{"key":"B","text":"\"Dropped the address fields for privacy. Approved.\""},{"key":"C","text":"\"3 Nov. Dropped the address fields: the purpose does not need them. Approved by the analyst who wrote this entry.\""},{"key":"D","text":"\"3 Nov. Dropped the address fields: not needed for the purpose. Approved by the registrar.\""}],"correct":[3],"answer":null,"tolerance":null,"unit":null,"explanation":"A traceable entry has the date, the decision, the reason and a named role with the authority to approve it.","misconceptions":["Records the action without reason, date or authority","Names no approver who can be asked","Lets the author approve her own decision",""],"lo":["LO5"],"day":3,"session":1,"slide":{"deck":"day3","id":"analysis-log","title":"Every decision has a reason, a date and an approver"},"level":"apply","pool":"practice"},{"id":"q-docs-02","type":"single","prompt":"An analyst knows that attendance is recorded too low for one group of students. Where does that belong?","options":[{"key":"A","text":"Nowhere in writing: it would weaken trust in the analysis"},{"key":"B","text":"In the datasheet, under how the data was collected, with the size of the problem"},{"key":"C","text":"Only in a code comment beside the line that loads the field, where the next programmer will see it"},{"key":"D","text":"In a private note to the manager"}],"correct":[1],"answer":null,"tolerance":null,"unit":null,"explanation":"A datasheet tells a user what is wrong with the data before they rely on it. A reader who finds the weakness alone trusts nothing else.","misconceptions":["Believes hiding a weakness protects the work","","Puts documentation where only the author will read it","Keeps a known limit away from the people who use the data"],"lo":["LO5"],"day":3,"session":1,"slide":{"deck":"day3","id":"state-the-weakness","title":"A datasheet that states the data's weakness protects the analysis"},"level":"understand","pool":"practice"},{"id":"q-docs-03","type":"single","prompt":"A release record carries a hash of the data file as well as a version number. What does the hash add?","options":[{"key":"A","text":"It encrypts the file"},{"key":"B","text":"It makes the file anonymous, because a hash cannot be turned back into the records it was computed from"},{"key":"C","text":"It lets anyone check that the file they hold is the one the result came from"},{"key":"D","text":"It replaces the need for an approver"}],"correct":[2],"answer":null,"tolerance":null,"unit":null,"explanation":"A version number is a claim. A hash changes if one byte changes, so it can be checked.","misconceptions":["Confuses a fingerprint with protection","Confuses a fingerprint of a file with a pseudonym for a person","","Treats a technical check as an approval"],"lo":["LO5"],"day":3,"session":1,"slide":{"deck":"day3","id":"versioned-release","title":"A release is a version, a date, fingerprints and one line of warning"},"level":"understand","pool":"practice"},{"id":"q-docs-04","type":"single","prompt":"A table with a suppressed cell is ready for release. Who should appear as approver in the log?","options":[{"key":"A","text":"The data owner, after a second person has checked the suppression"},{"key":"B","text":"The analyst who built the table"},{"key":"C","text":"\"The team\""},{"key":"D","text":"Nobody: the threshold rule was applied by tested code, which is more reliable than a signature"}],"correct":[0],"answer":null,"tolerance":null,"unit":null,"explanation":"Release is the data owner's decision, and the check by a second person catches what the author no longer sees.","misconceptions":["","Lets the author approve her own release","Names nobody who can be asked or shown to have authority","Treats automation as approval"],"lo":["LO5"],"day":3,"session":1,"slide":{"deck":"day3","id":"approver-is-a-person","title":"An approver is a named person with the authority to approve that thing"},"level":"apply","pool":"practice"},{"id":"q-talk-01","type":"single","prompt":"A director says: \"Send me everything you have on the support programme.\" What does the analyst ask next?","options":[{"key":"A","text":"\"In which file format?\""},{"key":"B","text":"\"For which years?\""},{"key":"C","text":"\"Do you have written permission to see all of it?\""},{"key":"D","text":"\"What will you decide with it, and by when?\""}],"correct":[3],"answer":null,"tolerance":null,"unit":null,"explanation":"The decision tells the analyst which answer would matter, what data it needs and what is out of scope.","misconceptions":["Starts with delivery before purpose","Narrows the data before knowing the decision","Opens with a challenge instead of the sponsor's need",""],"lo":["LO6"],"day":3,"session":2,"slide":{"deck":"day3","id":"four-questions","title":"Four questions turn a request into something answerable"},"level":"apply","pool":"practice"},{"id":"q-talk-02","type":"single","prompt":"A vice-rector asks for a named list of students likely to fail, for the deans. She has to decide where to place new advisors. Which reply pushes back without obstructing?","options":[{"key":"A","text":"\"That is against the law, so I cannot help.\""},{"key":"B","text":"\"I can give you struggling students by college by Sunday, which places the advisors. Names stay with each student's advisor, because a list of predicted failure can follow a student into grading.\""},{"key":"C","text":"\"I will send it, but please keep it confidential.\""},{"key":"D","text":"\"I will send the list without the scores.\""}],"correct":[1],"answer":null,"tolerance":null,"unit":null,"explanation":"It serves her decision first, then names the harm in plain words. The alternative needs no names.","misconceptions":["Cites a rule and offers no way to serve the decision","","Complies and relies on a request for discretion","Removes a detail and keeps the harm: the names still reach the deans"],"lo":["LO6"],"day":3,"session":3,"slide":{"deck":"day3","id":"anatomy-of-a-no","title":"A refusal that works has five parts, and the alternative comes early"},"level":"analyze","pool":"practice"},{"id":"q-talk-03","type":"single","prompt":"After the analyst offers counts by college, the sponsor still insists on the named list and says it is an instruction. What does the analyst do?","options":[{"key":"A","text":"Sends the list: an instruction ends the matter"},{"key":"B","text":"Stops answering the sponsor's messages"},{"key":"C","text":"Writes to the data protection officer what was asked, what was offered and the decision needed, and copies the sponsor"},{"key":"D","text":"Asks a colleague in another unit, who has access to the same records and fewer doubts, to send the list instead"}],"correct":[2],"answer":null,"tolerance":null,"unit":null,"explanation":"The decision is neither the analyst's nor the sponsor's alone. Escalating openly says whose it is.","misconceptions":["Believes seniority transfers the decision to the sponsor","Obstructs by silence","","Moves the act to someone else without changing who should decide"],"lo":["LO6"],"day":3,"session":3,"slide":{"deck":"day3","id":"escalate","title":"Escalating is saying aloud whose decision it is"},"level":"apply","pool":"practice"},{"id":"q-talk-04","type":"single","prompt":"A slide will say \"The rule referred 55% of struggling students\". Which added line best explains the limits to a council of non-specialists?","options":[{"key":"A","text":"\"It missed 45%, is less reliable for two named groups, and must not be used to judge individual students.\""},{"key":"B","text":"\"The 95% Wilson interval is 53% to 57%.\""},{"key":"C","text":"\"Results should be interpreted with caution.\""},{"key":"D","text":"\"The analysis used a pseudonymised extract of 18,000 student records, approved by the registrar in November.\""}],"correct":[0],"answer":null,"tolerance":null,"unit":null,"explanation":"A limits statement blocks the likeliest misreadings: that the rule is complete, equal for all groups, and a verdict on a student.","misconceptions":["","Reports sampling uncertainty and leaves every misuse open","Offers a general disclaimer that names no limit","Gives a method note that blocks no misreading"],"lo":["LO6"],"day":3,"session":4,"slide":{"deck":"day3","id":"three-sentences","title":"Three sentences that travel with the number"},"level":"analyze","pool":"practice"}]}</script>
